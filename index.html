<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cupola · Venue Dashboards</title>
  <meta name="description" content="Sales, seat maps, pacing, audience and call-center views in one place. Interactive demo on synthetic data." />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#fcfcfb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Cupola" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- Link preview when the URL is texted, emailed or posted -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Cupola" />
  <meta property="og:title" content="Cupola · Venue Dashboards" />
  <meta property="og:description" content="Sales, seat maps, pacing, audience and call-center views in one place. Interactive demo on synthetic data." />
  <meta property="og:url" content="https://nicksmith527.github.io/cupola-demo/" />
  <meta property="og:image" content="https://nicksmith527.github.io/cupola-demo/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-icon" src="icons/icon.svg" alt="" width="26" height="26" />
      <span class="brand-name" id="brand-name">Cupola</span>
      <span class="brand-sub" id="venue-name"></span>
    </div>
    <div class="status">
      <label class="market"><span class="hide-sm">Market</span>
        <select id="market" aria-label="Market"></select>
      </label>
      <span class="badge" title="Every number in this demo is invented">Synthetic demo data</span>
      <span class="refresh" id="refresh">
        <svg class="refresh-ring" viewBox="0 0 20 20" aria-hidden="true">
          <circle class="track" cx="10" cy="10" r="8" />
          <circle class="prog" cx="10" cy="10" r="8" stroke-dasharray="50.27" stroke-dashoffset="0" />
        </svg>
        <span id="as-of">Loading…</span>
      </span>
      <button class="refresh-btn" id="refresh-now" type="button">Refresh now</button>
    </div>
  </header>

  <nav class="nav" id="nav" aria-label="Dashboards"></nav>

  <main id="view" aria-live="polite"></main>

  <footer id="footer"></footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cupola · Venue Dashboards Demo</title>
  <meta name="description" content="Interactive venue analytics demo built on synthetic data." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233987e5'/><rect x='7' y='17' width='4' height='8' rx='1' fill='white'/><rect x='14' y='11' width='4' height='14' rx='1' fill='white'/><rect x='21' y='7' width='4' height='18' rx='1' fill='white'/></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-name" id="brand-name">Cupola</span>
      <span class="brand-sub" id="venue-name"></span>
    </div>
    <div class="status">
      <span class="badge" title="Every number in this demo is invented">Synthetic demo data</span>
      <span class="refresh" id="refresh">
        <svg class="refresh-ring" viewBox="0 0 20 20" aria-hidden="true">
          <circle class="track" cx="10" cy="10" r="8" />
          <circle class="prog" cx="10" cy="10" r="8" stroke-dasharray="50.27" stroke-dashoffset="0" />
        </svg>
        <span id="as-of">Loading…</span>
      </span>
      <button class="refresh-btn" id="refresh-now" type="button">Refresh now</button>
    </div>
  </header>

  <nav class="nav" id="nav" aria-label="Dashboards"></nav>

  <main id="view" aria-live="polite"></main>

  <footer id="footer"></footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
